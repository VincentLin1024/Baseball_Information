// ============ 狀態 ============
let leagueId = "MLB";
let teamId = null;
let map = null;
let layer = null;

// ============ 工具函式 ============
function currentTeams() { return data[leagueId].teams; }
function selectedTeam() { return currentTeams().find(t => t.id === teamId) || null; }
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ============ 渲染：聯盟分頁籤 ============
function renderTabs() {
  const wrap = document.getElementById("leagueTabs");
  wrap.innerHTML = "";
  Object.keys(data).forEach(id => {
    const btn = document.createElement("button");
    btn.className = "league-btn" + (id === leagueId ? " active" : "");
    btn.style.background = id === leagueId ? accent : "transparent";
    btn.style.color = id === leagueId ? "#0b1119" : "#9aa9bf";
    btn.innerHTML =
      '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:19px;font-weight:700;letter-spacing:.1em;">' + id + '</span>' +
      '<span style="font-size:11px;opacity:.75;margin-left:8px;">' + data[id].label + '</span>';
    btn.addEventListener("click", () => setLeague(id));
    wrap.appendChild(btn);
  });
  document.getElementById("teamCountLabel").textContent =
    "點擊球隊圓點查看資訊 · 目前顯示 " + currentTeams().length + " 支球隊";
}

// ============ 渲染：地圖與標記 ============
function initMap() {
  const v = data[leagueId].view;
  map = L.map("mapEl", { zoomControl: true, attributionControl: true, worldCopyJump: true }).setView(v[0], v[1]);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ | Data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  drawMarkers();
  setTimeout(() => map.invalidateSize(), 60);
  window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
}

function drawMarkers() {
  layer.clearLayers();
  const d = markerSize * 2;
  currentTeams().forEach(t => {
    const icon = L.divIcon({
      className: "bb-dot",
      iconSize: [d, d],
      iconAnchor: [markerSize, markerSize],
      html: '<span style="display:block;width:' + d + 'px;height:' + d + 'px;border-radius:50%;background:' +
            t.color + ';border:2px solid rgba(234,241,250,.9);box-shadow:0 2px 8px rgba(0,0,0,.55);cursor:pointer;"></span>'
    });
    const m = L.marker(t.ll, { icon, title: t.name, riseOnHover: true }).addTo(layer);
    m.bindTooltip(t.name, { direction: "top", offset: [0, -markerSize - 4] });
    m.on("click", () => openPanel(t.id));
  });
}

function setLeague(id) {
  if (id === leagueId) return;
  leagueId = id;
  teamId = null;
  renderTabs();
  renderPanel();
  drawMarkers();
  const v = data[id].view;
  map.setView(v[0], v[1], { animate: true });
}

// ============ 渲染：資訊面板 ============
function openPanel(id) {
  teamId = id;
  renderPanel();
}
function closePanel() {
  teamId = null;
  renderPanel();
}

function renderPanel() {
  const root = document.getElementById("panelRoot");
  const t = selectedTeam();

  if (!t) { root.innerHTML = ""; return; }

  const teamColor = t.color;
  const videoEmbedUrl = t.videoId ? "https://www.youtube.com/embed/" + t.videoId : "";
  const hasVideo = !!t.videoId;

  const starsHtml = (t.stars || []).map(s =>
    '<div style="display:flex;gap:12px;align-items:baseline;padding:11px 14px;background:#131b28;border-left:3px solid ' + teamColor + ';border-radius:0 10px 10px 0;">' +
      '<div style="font-weight:700;font-size:15px;flex:none;">' + escapeHtml(s.name) + '</div>' +
      '<div style="font-size:13px;color:#9aa9bf;line-height:1.5;">' + escapeHtml(s.note) + '</div>' +
    '</div>'
  ).join("");

  const historyHtml = t.history
    ? '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;margin:22px 0 8px;">球隊沿革</div>' +
      '<div style="font-size:13px;color:#9aa9bf;line-height:1.7;">' + escapeHtml(t.history) + '</div>'
    : "";

  const videoBlock = hasVideo
    ? '<div>' +
        '<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;">' +
          '<iframe src="' + videoEmbedUrl + '" style="position:absolute;inset:0;width:100%;height:100%;border:0;" ' +
          'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
        '</div>' +
        '<div style="margin-top:14px;font-size:12px;color:#8b9ab0;line-height:1.7;">該隊冠軍賽精華 / 經典時刻。</div>' +
      '</div>'
    : '<div>' +
        '<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;border:1px dashed #2c3c55;background:repeating-linear-gradient(45deg,#111a27 0px,#111a27 9px,#0e1621 9px,#0e1621 18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">' +
          '<div style="width:52px;height:36px;border-radius:8px;background:#1c2839;border:1px solid #2c3c55;display:flex;align-items:center;justify-content:center;">' +
            '<span style="width:0;height:0;border-left:12px solid #55697f;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px;"></span>' +
          '</div>' +
          '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#6b7b93;text-align:center;line-height:1.6;">尚未提供影片</div>' +
        '</div>' +
      '</div>';

  root.innerHTML =
    '<div id="panelBackdrop" style="position:absolute;inset:0;z-index:900;background:rgba(4,7,12,.55);animation:fadeIn .2s ease;"></div>' +
    '<div style="position:absolute;left:0;right:0;bottom:0;z-index:901;animation:cardUp .32s cubic-bezier(.22,.85,.3,1);">' +
      '<div style="max-width:980px;margin:0 auto;background:#0f1622;border:1px solid #223047;border-bottom:none;border-radius:18px 18px 0 0;box-shadow:0 -24px 60px rgba(0,0,0,.6);overflow:hidden;">' +
        '<div style="height:4px;background:' + teamColor + ';"></div>' +
        '<div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding:24px 28px 28px;max-height:62vh;overflow:auto;">' +
          '<div style="min-width:0;">' +
            '<div style="display:flex;align-items:flex-start;gap:14px;">' +
              '<span style="flex:none;width:34px;height:34px;border-radius:50%;margin-top:4px;background:' + teamColor + ';border:2px solid rgba(255,255,255,.25);"></span>' +
              '<div style="min-width:0;">' +
                '<div style="font-size:24px;font-weight:700;letter-spacing:.02em;">' + escapeHtml(t.name) + '</div>' +
                '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#7b8ca4;margin-top:2px;">' + escapeHtml(t.en) + '</div>' +
              '</div>' +
              '<button id="panelCloseBtn" style="margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:#182233;border:1px solid #2a3a52;color:#93a3b9;font-size:16px;line-height:1;cursor:pointer;">×</button>' +
            '</div>' +
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px;">' +
              '<div style="background:#141d2c;border:1px solid #1f2b3e;border-radius:12px;padding:12px 14px;">' +
                '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;">City</div>' +
                '<div style="font-size:15px;font-weight:500;margin-top:5px;">' + escapeHtml(t.city) + '</div>' +
              '</div>' +
              '<div style="background:#141d2c;border:1px solid #1f2b3e;border-radius:12px;padding:12px 14px;">' +
                '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;">Stadium</div>' +
                '<div style="font-size:15px;font-weight:500;margin-top:5px;">' + escapeHtml(t.stadium) + '</div>' +
              '</div>' +
              '<div style="background:#141d2c;border:1px solid #1f2b3e;border-radius:12px;padding:12px 14px;">' +
                '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;">Titles</div>' +
                '<div style="font-size:15px;font-weight:500;margin-top:5px;">' + escapeHtml(t.titles) + '</div>' +
              '</div>' +
            '</div>' +
            historyHtml +
            '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;margin:22px 0 10px;">代表球星</div>' +
            '<div style="display:flex;flex-direction:column;gap:10px;">' + starsHtml + '</div>' +
            '<div style="margin-top:18px;font-size:11px;color:#5d6b80;">※ 球場、冠軍次數與球星資料為示範內容，待核實。</div>' +
          '</div>' +
          '<div style="min-width:0;">' +
            '<div style="font-size:11px;letter-spacing:.14em;color:#6f8098;text-transform:uppercase;margin-bottom:10px;">冠軍精華影片</div>' +
            videoBlock +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById("panelBackdrop").addEventListener("click", closePanel);
  document.getElementById("panelCloseBtn").addEventListener("click", closePanel);
}

// ============ 啟動 ============
renderTabs();
initMap();
renderPanel();
</script>
</body>
</html>
